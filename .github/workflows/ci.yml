# =============================================================================
# 轻量校验工作流 / Lightweight CI checks
#
# 范围（严格遵守设计基线 §10.2）：
#   - 本工作流**只做静态校验与单元测试**，不编译安装包、不发布产物。
#   - 生产构建一律走手动触发的工作流（workflow_dispatch），见 build-*.yml。
#
# 为什么需要它：开发机上没有 Go / CMake / JDK（见
# design/plan/environment-constraints.md），因此 gofmt / go vet / go test
# 只能在 CI 中执行，否则源码质量无从验证。
#
# 作业刻意拆成 4 个并行作业，而不是串在一起：
#   格式问题是最容易修的一类，如果它让整个流水线在第一步就停下，
#   真正的编译错误会被掩盖。并行之后一次运行就能看到全部问题。
#
# 触发方式：推送到任意分支、发起 PR，或在 Actions 页面手动 Run workflow。
# =============================================================================

name: CI checks

on:
  push:
    branches: ['**']
    paths:
      - 'src/versions/**'
      - 'design/**'
      - 'locales/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/versions/**'
      - 'design/**'
      - 'locales/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 同一分支的重复推送取消旧运行，节省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 当前在开发的版本目录。新增版本时改这里。
  VERSION_DIR: src/versions/0.1.0
  GO_MODULE_DIR: src/versions/0.1.0/src

jobs:
  # ---------------------------------------------------------------------------
  # 0) 无工具链静态预检
  #
  # 这两个检查不需要 Go，跑得很快，而且能给出比编译器更精确的提示
  # （直接指出是哪个 import 未使用、哪个引用解析不了）。
  # 它们不替代 go build，只是让问题更快被看懂。
  # ---------------------------------------------------------------------------
  static-prechecks:
    name: Go static pre-checks (no toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect unused imports
        shell: pwsh
        run: |
          # Go 拒绝编译引用了却未使用的包，这是新代码最常见的编译错误。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-go-imports.ps1

      - name: Verify internal package references resolve
        shell: pwsh
        run: |
          # 跨包符号引用写错（改名、拼错）也会直接编译失败。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-go-symbols.ps1

      - name: Verify C++ structural consistency
        shell: pwsh
        run: |
          # 本机没有 C++ 工具链，无法编译桌面端；这个脚本检查的是
          # CMake 引用的文件是否存在、include 是否可解析、括号是否配平。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-cpp-structure.ps1

      - name: Verify the Go <-> C++ IPC contract
        shell: pwsh
        run: |
          # IPC 协议在 Go 与 C++ 各实现一次，两侧必须逐字一致。
          # 漂移不会响亮地失败，典型表现是「服务端说成功但界面没反应」，
          # 两种语言的编译器都抓不到，只能这样直接对比定义。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-ipc-contract.ps1

      - name: Verify authored files are tracked by git
        shell: pwsh
        run: |
          # 其他检查都读磁盘文件，无法区分「文件存在」与「文件已入仓」。
          # 这个缺口已经造成过实际事故：.gitignore 里的 `secrets/`
          # 匹配任意层级的同名目录，导致 shared/secrets 整个包从未被提交，
          # 本机全绿而 CI 报 `package proxyclient/shared/secrets is not in std`。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-tracked-files.ps1

      - name: Verify workflow files are structurally consistent
        shell: pwsh
        run: |
          # 工作流是真正构建与交付产品的代码。损坏的工作流在最糟的时机失败：
          # 推送之后、在 Actions 标签页里、而且报错往往不指向真正的原因。
          # 其中最有价值的一项是：本地复用的工作流路径是否真的存在——
          # 路径写错只在工作流运行时才失败，报的是 invalid workflow file，
          # 而不是 file not found。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-workflows.ps1

      - name: Verify documentation links
        shell: pwsh
        run: |
          # 文档互相引用很多，而相对链接是按「包含它的文件所在目录」解析的。
          # ../ 的层数差一层，编辑器里看起来正常，点下去是 404。
          # 断链是读者在最需要那条指引时才会发现的缺陷。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-doc-links.ps1

      - name: Verify PowerShell scripts are ASCII-only
        shell: bash
        run: |
          # Windows PowerShell 5.1 按 ANSI 代码页读取无 BOM 的 .ps1，
          # 非 ASCII 内容会被错误解码并导致解析失败。
          # 这类失败只在 Windows 上出现，因此必须显式拦住。
          # 见 design/plan/environment-constraints.md 5.2。
          failed=0
          while IFS= read -r -d '' f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::this .ps1 contains non-ASCII bytes, which Windows PowerShell 5.1 mis-decodes"
              LC_ALL=C grep -nP '[^\x00-\x7F]' "$f" | head -5
              failed=1
            fi
          done < <(find tools src -name '*.ps1' -type f -print0)
          exit $failed

  # ---------------------------------------------------------------------------
  # 1) 格式检查：独立作业，失败信息可一键应用
  # ---------------------------------------------------------------------------
  format:
    name: Go formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Check formatting (gofmt)
        id: gofmt
        continue-on-error: true
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$unformatted"
            echo ""
            echo "----- diff (first 300 lines) -----"
            gofmt -d . | head -300 || true
            # 同时产出一份可应用的补丁，供下载后一次性修复。
            gofmt -d . > "$RUNNER_TEMP/gofmt.patch" || true
            exit 1
          fi
          echo "gofmt: OK"

      - name: Upload the formatting patch
        if: steps.gofmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-fixes
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job if formatting was wrong
        if: steps.gofmt.outcome == 'failure'
        run: |
          echo "::error::Formatting check failed."
          echo "Fix it either way:"
          echo "  a) download the 'gofmt-fixes' artifact and run: git apply gofmt.patch"
          echo "  b) run 'gofmt -w .' in ${{ env.GO_MODULE_DIR }} locally and commit"
          exit 1

  # ---------------------------------------------------------------------------
  # 2) 编译与测试（Linux）
  # ---------------------------------------------------------------------------
  go-checks-linux:
    name: Go build / vet / test (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Go version from the lock file
        id: goversion
        run: |
          set -euo pipefail
          lock="${VERSION_DIR}/deploy/targets/versions.lock.json"
          if [ ! -f "$lock" ]; then
            echo "::error::version lock file not found: $lock"
            exit 1
          fi
          pinned=$(jq -r '.toolchains.go // empty' "$lock")
          if [ -z "$pinned" ] || [ "$pinned" = "null" ]; then
            echo "::warning::toolchains.go is not pinned in the lock file; falling back to 1.24"
            pinned="1.24"
          fi
          echo "version=$pinned" >> "$GITHUB_OUTPUT"
          echo "Using Go $pinned"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache-dependency-path: ${{ env.GO_MODULE_DIR }}/go.sum

      - name: Build all packages
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go build ./...

      - name: Verify module metadata (go mod tidy)
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: |
          set -euo pipefail
          cp go.mod go.mod.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null; then
            echo "::error::go.mod is not tidy; run 'go mod tidy' and commit the result"
            diff go.mod.orig go.mod || true
            exit 1
          fi
          echo "go mod tidy: OK"

      - name: Static analysis (go vet)
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go vet ./...

      - name: Unit and contract tests
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go test ./... -count=1

      - name: Race detector
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go test ./... -race -count=1

  # ---------------------------------------------------------------------------
  # 3) 编译与测试（Windows）
  #
  # 存在理由：带 //go:build windows 的文件在 Linux 上根本不会被编译，
  # 只靠 Linux 作业验证，这类代码等于长期处于「未编译」状态。
  # ---------------------------------------------------------------------------
  go-checks-windows:
    name: Go build / test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Go version from the lock file
        id: goversion
        shell: pwsh
        run: |
          $lock = "${{ env.VERSION_DIR }}/deploy/targets/versions.lock.json"
          if (-not (Test-Path $lock)) {
            Write-Error "version lock file not found: $lock"
            exit 1
          }
          $json = Get-Content $lock -Raw -Encoding UTF8 | ConvertFrom-Json
          $pinned = $json.toolchains.go
          if ([string]::IsNullOrWhiteSpace($pinned) -or $pinned -eq 'null') {
            Write-Warning "toolchains.go is not pinned; falling back to 1.24"
            $pinned = '1.24'
          }
          "version=$pinned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Go $pinned"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache-dependency-path: ${{ env.GO_MODULE_DIR }}/go.sum

      - name: Build all packages
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go build ./...

      - name: Unit and contract tests
        working-directory: ${{ env.GO_MODULE_DIR }}
        run: go test ./... -count=1

  # ---------------------------------------------------------------------------
  # 4) 桌面端核心库与单元测试
  #
  # 只构建 pcx_core（JSON / i18n / IPC），**不构建 GUI**：
  # 这样不需要 wxWidgets 与 GTK，作业更快也更不容易因为环境问题失败。
  # GUI 的构建在可复用工作流里单独做。
  # ---------------------------------------------------------------------------
  desktop-core:
    name: Desktop core library and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        working-directory: ${{ env.VERSION_DIR }}/src/apps/desktop
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCX_BUILD_GUI=OFF \
            -DPCX_BUILD_TESTS=ON \
            -DPCX_WERROR=ON

      - name: Build
        working-directory: ${{ env.VERSION_DIR }}/src/apps/desktop
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: ${{ env.VERSION_DIR }}/src/apps/desktop
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # 5) 桌面端 GUI 构建
  #
  # 只做 Linux：这是唯一能在 ubuntu runner 上装齐 wxWidgets 且不引入
  # 第三方包管理器的平台。Windows 与 macOS 的 GUI 构建放在打包工作流里。
  # 这个作业的价值是：**界面代码第一次真的被编译过**。
  # ---------------------------------------------------------------------------
  desktop-gui:
    name: Desktop GUI build (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and wxWidgets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          # 包名随发行版变化：24.04 是 libwxgtk3.2-dev，22.04 是
          # libwxgtk3.0-gtk3-dev。两个都试，避免整个作业因为包名猜错而失败。
          sudo apt-get install -y --no-install-recommends libwxgtk3.2-dev \
            || sudo apt-get install -y --no-install-recommends libwxgtk3.0-gtk3-dev

      - name: Configure
        working-directory: ${{ env.VERSION_DIR }}/src/apps/desktop
        run: |
          cmake -S . -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCX_BUILD_GUI=ON \
            -DPCX_BUILD_TESTS=OFF \
            -DPCX_WERROR=ON

      - name: Build
        working-directory: ${{ env.VERSION_DIR }}/src/apps/desktop
        run: cmake --build build-gui --parallel

  # ---------------------------------------------------------------------------
  # 6) 设计契约与多语言资源
  # ---------------------------------------------------------------------------
  design-checks:
    name: Design JSON, config schema and i18n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax (design)
        run: |
          set -euo pipefail
          failed=0
          # src/references 是第三方快照，不入版本控制，因此不在此检查。
          while IFS= read -r -d '' f; do
            if jq empty "$f" >/dev/null 2>&1; then
              echo "  OK    $f"
            else
              echo "::error file=$f::invalid JSON"
              failed=1
            fi
          done < <(find design -name '*.json' -type f -print0)
          exit $failed

      - name: Validate JSON syntax (locales)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' f; do
            if jq empty "$f" >/dev/null 2>&1; then
              echo "  OK    $f"
            else
              echo "::error file=$f::invalid JSON"
              failed=1
            fi
          done < <(find locales -name '*.json' -type f -print0)
          exit $failed

      - name: Validate client-config.json against its schema
        shell: pwsh
        run: |
          # 复用仓库内校验器：本机与 CI 使用同一套规则，避免两套真相。
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/validate-client-config.ps1

      - name: Cross-check i18n keys against locale catalogs
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./tools/scripts/check-i18n-keys.ps1

  # ---------------------------------------------------------------------------
  # 7) 用真实核心校验生成的配置
  # ---------------------------------------------------------------------------
  #
  # 为什么值得单列一个作业：其余所有测试都只断言**我们自己写的字段名**，
  # 而字段名是否与核心一致，只有核心自己说了算。这个仓库已经因此吃过两次亏：
  #   - TUN 里写了一个不存在的 `dns_hijack` 字段；
  #   - 嗅探写在入站上（1.13 起被移除的旧字段），
  #     以及 fake-ip 被当成默认名称服务器。
  # 两种情况下我们自己的测试全绿，真实核心却拒绝整份配置。
  #
  # 核心来自 versions.lock.json 的锁定版本与 sha256，
  # 用仓库自己的 fetch-cores.ps1 下载并校验——因此这个作业同时也在验证
  # 「锁定信息是可用的」，而不是只验证配置。
  core-conformance:
    name: Real core accepts generated config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Go version from the lock file
        id: goversion
        run: |
          set -euo pipefail
          lock="${VERSION_DIR}/deploy/targets/versions.lock.json"
          pinned=$(jq -r '.toolchains.go // empty' "$lock")
          if [ -z "$pinned" ] || [ "$pinned" = "null" ]; then
            pinned="1.24"
          fi
          echo "version=$pinned" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: false

      - name: Fetch and verify the pinned core
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop' -or $IsWindows) { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          ./src/versions/0.1.0/deploy/packaging/fetch-cores.ps1 `
            -TargetId linux-amd64 -OutDir "$PWD/out/core"

      # 核心必须以可执行位存在；fetch-cores 只保证内容正确，
      # 而 Linux 上「文件在但不可执行」与「文件不在」的报错完全不同。
      - name: Compile a config and let the real core judge it
        run: |
          set -euo pipefail
          bin="$PWD/out/core/sing-box"
          chmod +x "$bin"
          "$bin" version
          # 先把绝对路径定下来：下面的 cd 会让相对路径产生歧义，
          # 而 SINGBOX_BIN 是子进程要用的，写错时表现为「测试被跳过」——
          # 一个静默跳过的验证比没有验证更危险，因为它看起来是绿的。
          cd "${GO_MODULE_DIR}"
          test -x "$bin"
          SINGBOX_BIN="$bin" go test ./shared/compiler/... -count=1 -v 2>&1 |
            tee /tmp/conformance.log
          # 明确要求校验用例真的跑过，而不是被跳过。
          if grep -q -- '--- SKIP' /tmp/conformance.log; then
            echo "::error::the real-core conformance tests were skipped; verification did not happen"
            exit 1
          fi
