# =============================================================================
# 可复用：桌面端构建 / Reusable: desktop build
#
# 覆盖 Windows 与 Linux 目标。Android 见 reusable-android.yml，Docker 见 reusable-docker.yml。
#
# 设计约束：
#   - 核心（Xray / sing-box）**不编译**，只下载官方预构建二进制并校验 SHA256（ADR-0003）。
#   - 未冻结的核心版本会阻断 release 构建；test 构建允许跳过下载，但会在摘要中标注。
#   - 应用源码尚未实现时 preflight 明确失败，不产出假的「构建成功」。
# =============================================================================

name: reusable-desktop

on:
  workflow_call:
    inputs:
      version_dir:
        required: true
        type: string
      preset:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'all'
      build_type:
        description: 'test 或 release'
        required: false
        type: string
        default: 'test'
      publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/reusable-resolve-targets.yml
    with:
      version_dir: ${{ inputs.version_dir }}
      preset: ${{ inputs.preset }}
      family: 'windows,linux'
      arch: ${{ inputs.arch }}
      include_docker: false

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      cores_resolved: ${{ steps.pins.outputs.cores_resolved }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify desktop source exists
        env:
          VERSION_DIR: ${{ inputs.version_dir }}
        run: |
          set -euo pipefail
          desktop_dir="${VERSION_DIR}/src/apps/desktop"
          if [ ! -f "${desktop_dir}/CMakeLists.txt" ]; then
            echo "::error::desktop source is missing: ${desktop_dir}/CMakeLists.txt"
            echo "The build intentionally fails instead of producing a fake success."
            echo "See design/plan/STATUS.md for the current stage and remaining work."
            exit 1
          fi
          echo "desktop source present"

      - name: Verify core pins for release builds
        id: pins
        env:
          VERSION_DIR: ${{ inputs.version_dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          lock="${VERSION_DIR}/deploy/targets/versions.lock.json"
          if [ ! -f "$lock" ]; then
            echo "::error::version lock file not found: $lock"
            exit 1
          fi

          missing=$(jq -r '
            [ .sources.xray_core, .sources.sing_box_core ]
            | map(select((.version // null) == null or (.sha256 // null) == null))
            | length' "$lock")

          if [ "$BUILD_TYPE" = "release" ] && [ "$missing" -gt 0 ]; then
            echo "::error::release build refused: $missing core pin(s) are unresolved in $lock"
            echo "Release builds must not run with placeholder pins (design baseline 10.2)."
            exit 1
          fi

          if [ "$missing" -gt 0 ]; then
            echo "::warning::core pins are unresolved; the package will not bundle cores."
            echo "cores_resolved=false" >> "$GITHUB_OUTPUT"
          else
            echo "cores_resolved=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [resolve, preflight]
    strategy:
      # 收集全部失败，发布成功标志前必须汇总（设计基线 §10.2）。
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    # runner 由目标清单的 desktopBuild.runner 决定，不在这里另立一份映射。
    runs-on: ${{ matrix.desktopBuild.runner }}
    name: desktop-${{ matrix.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report resolved target
        run: |
          echo "target   : ${{ matrix.id }}"
          echo "family   : ${{ matrix.family }}"
          echo "arch     : ${{ matrix.arch }}"
          echo "runner   : ${{ matrix.desktopBuild.runner }}"
          echo "wx source: ${{ matrix.desktopBuild.wxSource }}"
          echo "cores    : xray=${{ matrix.xrayAssetArch }} sing-box=${{ matrix.singBoxAssetArch }}"

      # -----------------------------------------------------------------------
      # 工具链
      # -----------------------------------------------------------------------
      - name: Install build tools (Linux)
        if: startsWith(matrix.family, 'linux')
        env:
          WX_SOURCE: ${{ matrix.desktopBuild.wxSource }}
          APT_PACKAGES: ${{ join(matrix.desktopBuild.aptPackages, ' ') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          if [ "$WX_SOURCE" = "apt-multiarch" ]; then
            # i386 依赖不默认启用；不启用的话 apt 会找不到这些包，
            # 而失败信息在几百行日志里很难被看见。
            sudo dpkg --add-architecture i386
            sudo apt-get update
          fi
          # 包名随发行版变化：24.04 是 libwxgtk3.2-dev，22.04 是 libwxgtk3.0-gtk3-dev。
          # 先按清单尝试，失败再回退到旧包名，并在日志里说明用了哪个。
          if ! sudo apt-get install -y --no-install-recommends cmake ninja-build $APT_PACKAGES; then
            fallback="${APT_PACKAGES//libwxgtk3.2-dev/libwxgtk3.0-gtk3-dev}"
            echo "::warning::primary wxWidgets packages were unavailable; retrying with: $fallback"
            sudo apt-get install -y --no-install-recommends cmake ninja-build $fallback
          fi
          dpkg -l | grep -i wxgtk || true

      - name: Install wxWidgets via vcpkg (Windows)
        if: startsWith(matrix.family, 'windows')
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.desktopBuild.vcpkgTriplet }}
        run: |
          # GitHub 的 Windows runner 预装 vcpkg，并已把二进制缓存接到
          # Actions 缓存上；因此首次运行会从源码构建 wxWidgets（较慢），
          # 后续运行会命中缓存。
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            Write-Error "VCPKG_INSTALLATION_ROOT is not set; cannot obtain wxWidgets."
            exit 1
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) {
            Write-Error "vcpkg not found at $vcpkg"
            exit 1
          }
          & $vcpkg install "wxwidgets:$env:VCPKG_TRIPLET" --triplet $env:VCPKG_TRIPLET
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg failed to install wxWidgets for $env:VCPKG_TRIPLET"
            exit 1
          }

      # -----------------------------------------------------------------------
      # 构建
      # -----------------------------------------------------------------------
      - name: Configure
        env:
          WX_SOURCE: ${{ matrix.desktopBuild.wxSource }}
          VCPKG_TRIPLET: ${{ matrix.desktopBuild.vcpkgTriplet }}
          CMAKE_ARCH: ${{ matrix.desktopBuild.cmakeArch }}
          EXTRA_FLAGS: ${{ join(matrix.desktopBuild.cmakeFlags, ' ') }}
        shell: bash
        working-directory: ${{ inputs.version_dir }}/src/apps/desktop
        run: |
          set -euo pipefail
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
                -DPCX_BUILD_GUI=ON -DPCX_BUILD_TESTS=ON -DPCX_WERROR=ON)

          # 目标架构的额外编译参数来自清单，不在这里写死。
          if [ -n "${EXTRA_FLAGS:-}" ]; then
            # shellcheck disable=SC2206
            args+=($EXTRA_FLAGS)
          fi

          if [ "$WX_SOURCE" = "vcpkg" ]; then
            # Windows 走 vcpkg 工具链文件；用 Visual Studio 生成器才能选目标架构，
            # 因此这里覆盖生成器。
            toolchain="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
            args=(-S . -B build -DCMAKE_BUILD_TYPE=Release
                  -DPCX_BUILD_GUI=ON -DPCX_BUILD_TESTS=ON -DPCX_WERROR=ON
                  "-DCMAKE_TOOLCHAIN_FILE=${toolchain}"
                  "-DVCPKG_TARGET_TRIPLET=${VCPKG_TRIPLET}"
                  "-A" "${CMAKE_ARCH}")
          fi

          cmake "${args[@]}"

      - name: Build
        working-directory: ${{ inputs.version_dir }}/src/apps/desktop
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        working-directory: ${{ inputs.version_dir }}/src/apps/desktop
        env:
          # 测试需要仓库里的语言资源与出厂配置。
          PCX_LOCALES_DIR: ${{ github.workspace }}/locales
          PCX_CONFIG_DIR: ${{ github.workspace }}/design
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Set up Go for the service build
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ inputs.version_dir }}/src/go.sum

      - name: Build the background service (Go)
        # GUI 没有这个服务就完全无法工作：所有涉及系统网络与核心进程的操作
        # 都在服务里。只打包 GUI 会得到一个能打开但什么都做不了的界面。
        #
        # 必须显式声明 shell: bash。
        # 下面这段是 bash 脚本（set -euo pipefail、case），
        # 而不声明 shell 时 Windows runner 的默认 shell 是 **PowerShell**——
        # 于是 bash 语法在那里直接解析失败：
        #     ParserError: D:\a\_temp\....ps1:4
        # 这个错误看起来像 Go 构建失败，实际与被编译的语言毫无关系。
        #
        # Linux 上恰好不会暴露：那里的默认 shell 就是 bash。
        # 「只在其中一个平台成立」的配置是最容易长期潜伏的一类。
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          GOARCH_TARGET: ${{ matrix.goArch }}
          VERSION_DIR: ${{ inputs.version_dir }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            windows) goos=windows ;;
            linux)   goos=linux ;;
            *) echo "::error::unsupported family for the service build: $FAMILY"; exit 1 ;;
          esac

          exe=""
          if [ "$goos" = "windows" ]; then exe=".exe"; fi

          mkdir -p "${GITHUB_WORKSPACE}/service-dist"
          (
            cd "${VERSION_DIR}/src"
            # -trimpath 去掉构建机上的绝对路径：否则二进制里会带上
            # 构建目录结构，既有隐私问题也让构建不可复现。
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$GOARCH_TARGET" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev}" \
              -o "${GITHUB_WORKSPACE}/service-dist/proxyclient-service${exe}" \
              ./cmd/proxyclient-service
          )
          ls -l "${GITHUB_WORKSPACE}/service-dist"

      # -----------------------------------------------------------------------
      # 打包
      #
      # 分成两个平台各写一份，而不是用 pwsh 兼容两种：
      # Git Bash 里没有 Compress-Archive，Linux runner 上也没有保证 pwsh 可用，
      # 硬凑一个「两种都能跑」的脚本只会得到两处都不稳的结果。
      # -----------------------------------------------------------------------
      - name: Assemble the package (Linux)
        if: startsWith(matrix.family, 'linux')
        env:
          TARGET_ID: ${{ matrix.id }}
          VERSION_DIR: ${{ inputs.version_dir }}
          CORES_RESOLVED: ${{ needs.preflight.outputs.cores_resolved }}
        working-directory: ${{ inputs.version_dir }}/src/apps/desktop
        run: |
          set -euo pipefail
          stage="stage/${TARGET_ID}"
          rm -rf "$stage"; mkdir -p "$stage"

          exe=$(find build -type f -name 'proxyclient-desktop' -perm -u+x | head -n1)
          if [ -z "$exe" ]; then
            echo "::error::the built executable was not found; refusing to produce an empty package"
            exit 1
          fi
          install -m 0755 "$exe" "$stage/proxyclient-desktop"

          # 后台服务：GUI 的必备组件，缺了它界面能打开但什么都做不了。
          service=$(find "${GITHUB_WORKSPACE}/service-dist" -type f -name 'proxyclient-service' | head -n1)
          if [ -z "$service" ]; then
            echo "::error::the background service binary was not built; the package would be unusable"
            exit 1
          fi
          install -m 0755 "$service" "$stage/proxyclient-service"

          # 语言资源：界面没有它们会显示键名而不是文案。
          cp -r "${GITHUB_WORKSPACE}/locales" "$stage/locales"
          mkdir -p "$stage/config"
          cp "${GITHUB_WORKSPACE}/design/client-config.json" "$stage/config/"

          if [ "$CORES_RESOLVED" = "true" ]; then
            # 用 bash 显式调用而不是依赖可执行位：可执行位在 Windows 上克隆时
            # 可能丢失，那会变成「文件明明在，却报权限不足」。
            bash "${GITHUB_WORKSPACE}/${VERSION_DIR}/deploy/packaging/fetch-cores.sh" \
              --target-id "$TARGET_ID" --out-dir "$stage/cores" \
              --version-dir "${GITHUB_WORKSPACE}/${VERSION_DIR}"
          else
            # 未冻结时不附带核心是刻意的：附上一个占位或未校验的核心，
            # 用户会以为拿到的是可用产物（设计基线 10.2）。
            #
            # 这里不用 heredoc：heredoc 的内容必须顶格写，
            # 而顶格的行会终止外层的 YAML 块标量，导致整个工作流文件解析失败。
            # printf 的每一行都能正常缩进。
            printf '%s\n' \
              'This build does not bundle the proxy cores.' \
              '' \
              'The versions in deploy/targets/versions.lock.json are not pinned yet, so no' \
              'core binary could be downloaded and verified. The client will fetch a core at' \
              'first run, or you can place one manually.' \
              '' \
              'See design/adr/ADR-0003 for the core distribution policy.' \
              > "$stage/CORES-NOT-BUNDLED.txt"
          fi

          # 用绝对路径，不要用 ../../.. 去数层数。
          #
          # 这里原本写的是 `mkdir -p ../../../../../dist`，
          # 而这个步骤设了 working-directory（apps/desktop），
          # 于是它与下一行 tar 要写的 "${GITHUB_WORKSPACE}/dist" 是**两个不同的目录**：
          # mkdir 建出的是 <workspace>/src/dist，tar 却要写 <workspace>/dist，
          # 报错是 `Cannot open: No such file or directory`——
          # 看上去像权限或磁盘问题，真正的原因是路径指到了别处。
          #
          # 同一个步骤里混用相对路径与绝对路径，是这类错误的根源。
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -czf "${GITHUB_WORKSPACE}/dist/${TARGET_ID}.tar.gz" -C stage "$TARGET_ID"
          echo "package: dist/${TARGET_ID}.tar.gz"

      - name: Assemble the package (Windows)
        if: startsWith(matrix.family, 'windows')
        shell: pwsh
        env:
          TARGET_ID: ${{ matrix.id }}
          VERSION_DIR: ${{ inputs.version_dir }}
          CORES_RESOLVED: ${{ needs.preflight.outputs.cores_resolved }}
        run: |
          $stage = "stage/$env:TARGET_ID"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 精确匹配可执行文件，不要用 'proxyclient-desktop*' 这样的通配符。
          #
          # 用通配符时的实际后果：构建目录里同时存在
          #   proxyclient-desktop.slnx   （Visual Studio 解决方案文件）
          #   proxyclient-desktop.exe    （真正要打包的程序）
          # 两者都匹配 'proxyclient-desktop*'，而 Select-Object -First 1
          # 挑中了 .slnx。于是包"构建成功"、里面的文件名前缀也对，
          # 但装上去打不开——用户拿到的是一个解决方案文件。
          #
          # 这类错误之所以危险，是因为每一步都报 success。
          # 因此这里既收窄匹配，又在找不到 .exe 时明确失败。
          $exe = Get-ChildItem -Path "$env:VERSION_DIR/src/apps/desktop/build" -Recurse -File -Filter 'proxyclient-desktop.exe' |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "proxyclient-desktop.exe was not found under the build directory; refusing to produce a package without the GUI"
            exit 1
          }
          if (-not $exe) {
            Write-Error "the built executable was not found; refusing to produce an empty package"
            exit 1
          }
          Copy-Item $exe.FullName (Join-Path $stage $exe.Name)

          # 后台服务：GUI 的必备组件，缺了它界面能打开但什么都做不了。
          # 同样精确匹配：理由见上面 exe 那段。
          # 服务二进制在 Windows 上是 proxyclient-service.exe。
          $service = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/service-dist" -Recurse -File -Filter 'proxyclient-service.exe' |
                     Select-Object -First 1
          if (-not $service) {
            Write-Error "the background service binary was not built; the package would be unusable"
            exit 1
          }
          Copy-Item $service.FullName (Join-Path $stage $service.Name)

          Copy-Item -Recurse "$env:GITHUB_WORKSPACE/locales" (Join-Path $stage 'locales')
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'config') | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/design/client-config.json" (Join-Path $stage 'config')

          if ($env:CORES_RESOLVED -eq 'true') {
            & "$env:GITHUB_WORKSPACE/$env:VERSION_DIR/deploy/packaging/fetch-cores.ps1" `
              -TargetId $env:TARGET_ID -OutDir (Join-Path $stage 'cores') `
              -VersionDir "$env:GITHUB_WORKSPACE/$env:VERSION_DIR"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "core fetch failed"
              exit 1
            }
          } else {
            # 未冻结时不附带核心是刻意的，理由见 Linux 分支的说明。
            Set-Content -Path (Join-Path $stage 'CORES-NOT-BUNDLED.txt') -Value @(
              'This build does not bundle the proxy cores.',
              '',
              'The versions in deploy/targets/versions.lock.json are not pinned yet, so no',
              'core binary could be downloaded and verified. The client will fetch a core at',
              'first run, or you can place one manually.',
              '',
              'See design/adr/ADR-0003 for the core distribution policy.')
          }

          # 与 Linux 分支同理：统一用绝对路径，
          # 不依赖本步骤当前的工作目录（这个步骤恰好没有设 working-directory，
          # 于是相对路径碰巧正确——但那是巧合，不是设计）。
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $dist "$env:TARGET_ID.zip") -Force
          Write-Host "package: dist/$env:TARGET_ID.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.id }}
          # 两个平台产出不同后缀，用通配符统一上传。
          path: dist/${{ matrix.id }}.*
          if-no-files-found: error
          retention-days: 14

      - name: Record the result
        shell: bash
        run: |
          echo "::notice::built ${{ matrix.id }} on ${{ matrix.desktopBuild.runner }}"
          echo "This workflow assembles a package; it does not run the app on real hardware."
          echo "Per the design baseline, unrun runtime checks stay 'not_run' (never 'passed')."

  summary:
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          set -euo pipefail
          echo "resolved targets: ${{ needs.resolve.outputs.count }}"
          echo "build job result: ${{ needs.build.result }}"
          # 必需目标失败即整体失败，不允许 continue-on-error 后宣称成功。
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::desktop build failed for at least one required target"
            exit 1
          fi
