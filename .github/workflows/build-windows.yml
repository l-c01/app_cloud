# =============================================================================
# 手动入口 2/7：构建 Windows / Manual entry: build Windows
# =============================================================================

name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version_dir:
        description: '版本目录'
        required: true
        default: 'src/versions/0.1.0'
        type: string
      arch:
        description: '架构；32 位与 ARM64 需各自的运行验证'
        required: false
        default: 'all'
        type: choice
        options: [all, amd64, '386', arm64]
      build_type:
        required: false
        default: 'test'
        type: choice
        options: [test, release]
      publish:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string
      source_ref:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/reusable-desktop.yml
    with:
      version_dir: ${{ inputs.version_dir }}
      preset: windows
      arch: ${{ inputs.arch }}
      build_type: ${{ inputs.build_type }}
      publish: ${{ inputs.publish }}
