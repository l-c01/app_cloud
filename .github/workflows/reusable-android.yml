# =============================================================================
# 可复用：Android 构建 / Reusable: Android build
#
# 设计约束：
#   - Android 核心集成方式（AAR 内嵌 vs 预构建二进制）由 G1 绑定探针决定，见 ADR-0003 第 5 条。
#   - 无用户签名密钥时只产出明确标注的 debug/test APK；缺少正式 keystore 时 release 必须失败。
#   - 应用源码尚未实现时 preflight 明确失败。
# =============================================================================

name: reusable-android

on:
  workflow_call:
    inputs:
      version_dir:
        required: true
        type: string
      preset:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'all'
      build_type:
        required: false
        type: string
        default: 'test'
      publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/reusable-resolve-targets.yml
    with:
      version_dir: ${{ inputs.version_dir }}
      preset: ${{ inputs.preset }}
      family: 'android'
      arch: ${{ inputs.arch }}
      include_docker: false

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android source exists
        env:
          VERSION_DIR: ${{ inputs.version_dir }}
        run: |
          set -euo pipefail
          android_dir="${VERSION_DIR}/src/apps/android"
          if [ ! -f "${android_dir}/settings.gradle.kts" ] && [ ! -f "${android_dir}/settings.gradle" ]; then
            echo "::error::Android source is not implemented yet: no settings.gradle(.kts) under ${android_dir}."
            echo "This is expected before stage G3."
            exit 1
          fi
          echo "Android source present"

      - name: Refuse release build without a stable signing key
        # 注意：这个 step 只能有一个 env 块。此前写成了两个同名的 env 键，
        # YAML 的重复键会让其中一个被丢弃（BUILD_TYPE 因此丢失），
        # 而脚本带着 set -u，于是 release 构建会以「未绑定变量」失败——
        # 报错与真正的原因（缺少密钥）完全不相干。
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE:-test}" != "release" ]; then
            echo "test build: a debug APK will be produced and clearly labelled."
            exit 0
          fi
          # 用户密钥必须放在仓库 Secrets 中；缺失时失败，绝不临时生成随机 release key。
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::release build requires Android signing secrets; refusing to fabricate a key."
            echo "Provide ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS in repository secrets."
            exit 1
          fi
          echo "signing secrets present"

  build:
    needs: [resolve, preflight]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: android-${{ matrix.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report resolved target
        run: |
          echo "target : ${{ matrix.id }}"
          echo "abi    : ${{ matrix.abi }}"
          echo "goarch : ${{ matrix.goArch }}${{ matrix.goarm }}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 不用项目里的 gradle wrapper：wrapper 的 jar 是二进制，
          # 不入版本控制。由这个 action 提供 Gradle 并接管缓存。
          gradle-version: '8.11.1'

      - name: Verify the Android SDK is available
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            echo "::error::ANDROID_HOME is not set; the Android SDK is required to build the APK."
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Build the APK for the requested ABI
        working-directory: ${{ inputs.version_dir }}/src/apps/android
        env:
          ABI: ${{ matrix.abi }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          # 清单里的 abi 字段已经是 Android 的取值（arm64-v8a / armeabi-v7a / x86），
          # 因此直接用，不做二次映射——二次映射是错位的常见来源。
          if [ "${BUILD_TYPE:-test}" = "release" ]; then
            variant="Release"
          else
            variant="Debug"
          fi
          echo "building variant=${variant} abi=${ABI}"
          gradle --no-daemon ":app:assemble${variant}" "-Ppcx.abiFilter=${ABI}"

      - name: Verify the APK actually contains the requested ABI
        working-directory: ${{ inputs.version_dir }}/src/apps/android
        env:
          ABI: ${{ matrix.abi }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE:-test}" = "release" ]; then
            pattern="app/build/outputs/apk/release"
          else
            pattern="app/build/outputs/apk/debug"
          fi
          apk=$(find "$pattern" -name '*.apk' 2>/dev/null | head -n1 || true)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          echo "apk: $apk"

          # 列出原生库目录，确认只包含请求的 ABI。
          #
          # 只检查「构建成功」是不够的：ABI 过滤配错时构建照样成功，
          # 产出的却是另一个架构的包，而用户要到安装或运行时才发现。
          abs=$(unzip -l "$apk" | awk '/lib\// { split($4, p, "/"); print p[2] }' | sort -u | tr -d '\r')
          echo "ABIs found in the APK:"
          echo "$abs" | sed 's/^/  /'

          if [ -z "$abs" ]; then
            # 当前还没有核心原生库，因此这里只提示而不失败。
            # 等核心绑定接入后，这个分支应当改成失败。
            echo "::warning::the APK contains no native libraries (expected before core integration)."
          elif ! echo "$abs" | grep -qx "$ABI"; then
            echo "::error::the APK does not contain the requested ABI '$ABI'"
            exit 1
          elif [ "$(echo "$abs" | wc -l)" -ne 1 ]; then
            echo "::error::the APK contains more than one ABI; the filter did not apply"
            exit 1
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.id }}
          path: ${{ inputs.version_dir }}/src/apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record the limitations of this build
        run: |
          echo "::notice::built APK for ${{ matrix.id }} (abi=${{ matrix.abi }})"
          echo "This APK does not capture traffic yet: core integration awaits the G1 binding probe."
          echo "Runtime verification on a real device is not performed by this workflow; it stays 'not_run'."

  summary:
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          set -euo pipefail
          echo "resolved targets: ${{ needs.resolve.outputs.count }}"
          echo "build job result: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Android build failed for at least one required target"
            exit 1
          fi
