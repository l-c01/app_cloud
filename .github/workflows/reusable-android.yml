# =============================================================================
# 可复用：Android 构建 / Reusable: Android build
#
# 设计约束：
#   - Android 核心集成方式（AAR 内嵌 vs 预构建二进制）由 G1 绑定探针决定，见 ADR-0003 第 5 条。
#   - 无用户签名密钥时只产出明确标注的 debug/test APK；缺少正式 keystore 时 release 必须失败。
#   - 应用源码尚未实现时 preflight 明确失败。
# =============================================================================

name: reusable-android

on:
  workflow_call:
    inputs:
      version_dir:
        required: true
        type: string
      preset:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'all'
      build_type:
        required: false
        type: string
        default: 'test'
      publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0) 构建核心的 Android 绑定（libbox.aar）
  # ---------------------------------------------------------------------------
  #
  # 为什么必须有这一步：APK 里**必须**带上核心的原生库，否则
  # 「VPN 能建立但一点流量都不代理」——那正是本项目长期挂着的状态。
  #
  # 方式由 ADR-0006 决定：用 gomobile 把 sing-box 的 `experimental/libbox`
  # 编成 AAR，由我们自己的 Kotlin 实现 libbox 的 `PlatformInterface`
  # （见 apps/android/.../vpn/VpnPlatformInterface.kt），把 VpnService 的
  # fd 交给核心。
  #
  # 核心版本来自 versions.lock.json —— **不在工作流里写死版本号**：
  # 写死会让「锁定的版本」与「实际构建的版本」悄悄分叉，而
  # versions.lock.json 存在的唯一理由就是防止这件事。
  libbox-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the pinned core version and Go version
        id: pins
        run: |
          set -euo pipefail
          lock="${{ inputs.version_dir }}/deploy/targets/versions.lock.json"
          if [ ! -f "$lock" ]; then
            echo "::error::version lock file not found: $lock"
            exit 1
          fi
          core=$(jq -r '.sources.sing_box_core.version // empty' "$lock")
          if [ -z "$core" ] || [ "$core" = "null" ]; then
            echo "::error::sources.sing_box_core.version is not pinned; refusing to build an unverified core"
            exit 1
          fi
          gov=$(jq -r '.toolchains.go // empty' "$lock")
          if [ -z "$gov" ] || [ "$gov" = "null" ]; then
            echo "::error::toolchains.go is not pinned; the AAR must be built with a pinned toolchain"
            exit 1
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "goversion=$gov" >> "$GITHUB_OUTPUT"
          echo "building libbox for sing-box $core with Go $gov"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.goversion }}
          cache: false

      # Android SDK 在 ubuntu runner 上已有；NDK 需要显式安装。
      - name: Set up the Android NDK
        id: ndk
        run: |
          set -euo pipefail
          ndk_version="27.2.12479018"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk_version}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          echo "ndk=${ANDROID_HOME}/ndk/${ndk_version}" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned core source
        run: |
          set -euo pipefail
          core="${{ steps.pins.outputs.core }}"
          url="https://github.com/SagerNet/sing-box/archive/refs/tags/v${core}.tar.gz"
          echo "downloading $url"
          curl -fsSL "$url" -o /tmp/sing-box.tar.gz
          mkdir -p "$RUNNER_TEMP/src"
          tar -xzf /tmp/sing-box.tar.gz -C "$RUNNER_TEMP/src"
          echo "SINGBOX_SRC=$RUNNER_TEMP/src/sing-box-${core}" >> "$GITHUB_ENV"
          # 源码的 go.mod 声明的 Go 版本必须被我们的工具链满足，
          # 否则构建会以一条看不懂的 toolchain 错误失败。
          head -3 "$RUNNER_TEMP/src/sing-box-${core}/go.mod"

      # 用 sagernet 的 gomobile 分支：官方 Android 客户端用的就是它。
      # 上游 golang/mobile 与本仓库的构建脚本并不等价，换掉会得到
      # 一个「看起来能编」但不被官方验证过的产物。
      - name: Install gomobile
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar
        working-directory: ${{ env.SINGBOX_SRC }}
        run: |
          set -euo pipefail
          # 标签集与 sing-box 官方 build_libbox 一致（去掉 Tailscale 相关的
          # 可选功能，本项目用不到，去掉能显著缩小 AAR）。
          tags="with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,with_openvpn,with_openconnect"
          gomobile init
          gomobile bind \
            -v \
            -target android \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -tags "$tags" \
            -o "$GITHUB_WORKSPACE/libbox.aar" \
            ./experimental/libbox
          ls -la "$GITHUB_WORKSPACE/libbox.aar"

      # 断言 AAR 里真的有原生库，而不是一个空壳。
      # 「构建成功」与「产物里带着核心」是两件事，而前者不足以让
      # 「VPN 能代理流量」成立。
      - name: Verify the AAR actually contains the core libraries
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/libbox.aar"
          if [ ! -s "$aar" ]; then
            echo "::error::libbox.aar is missing or empty"
            exit 1
          fi
          listing=$(unzip -l "$aar")
          echo "$listing" | grep -E 'jni/(arm64-v8a|armeabi-v7a|x86)/' \
            || { echo "::error::the AAR contains no native libraries for the expected ABIs"; exit 1; }
          # Java 侧必须真的生成了 libbox 的类，否则 Kotlin 无法调用它。
          echo "$listing" | grep -q 'classes.jar' \
            || { echo "::error::the AAR contains no classes.jar; gomobile bind did not produce a Java API"; exit 1; }

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
          if-no-files-found: error
          retention-days: 14

  resolve:
    needs: [libbox-aar]
    uses: ./.github/workflows/reusable-resolve-targets.yml
    with:
      version_dir: ${{ inputs.version_dir }}
      preset: ${{ inputs.preset }}
      family: 'android'
      arch: ${{ inputs.arch }}
      include_docker: false

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android source exists
        env:
          VERSION_DIR: ${{ inputs.version_dir }}
        run: |
          set -euo pipefail
          android_dir="${VERSION_DIR}/src/apps/android"
          if [ ! -f "${android_dir}/settings.gradle.kts" ] && [ ! -f "${android_dir}/settings.gradle" ]; then
            echo "::error::Android source is not implemented yet: no settings.gradle(.kts) under ${android_dir}."
            echo "This is expected before stage G3."
            exit 1
          fi
          echo "Android source present"

      - name: Refuse release build without a stable signing key
        # 注意：这个 step 只能有一个 env 块。此前写成了两个同名的 env 键，
        # YAML 的重复键会让其中一个被丢弃（BUILD_TYPE 因此丢失），
        # 而脚本带着 set -u，于是 release 构建会以「未绑定变量」失败——
        # 报错与真正的原因（缺少密钥）完全不相干。
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE:-test}" != "release" ]; then
            echo "test build: a debug APK will be produced and clearly labelled."
            exit 0
          fi
          # 用户密钥必须放在仓库 Secrets 中；缺失时失败，绝不临时生成随机 release key。
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::release build requires Android signing secrets; refusing to fabricate a key."
            echo "Provide ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS in repository secrets."
            exit 1
          fi
          echo "signing secrets present"

  build:
    needs: [libbox-aar, resolve, preflight]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: android-${{ matrix.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report resolved target
        run: |
          echo "target : ${{ matrix.id }}"
          echo "abi    : ${{ matrix.abi }}"
          echo "goarch : ${{ matrix.goArch }}${{ matrix.goarm }}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 不用项目里的 gradle wrapper：wrapper 的 jar 是二进制，
          # 不入版本控制。由这个 action 提供 Gradle 并接管缓存。
          gradle-version: '8.11.1'

      - name: Verify the Android SDK is available
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            echo "::error::ANDROID_HOME is not set; the Android SDK is required to build the APK."
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      # 下载上一步产出的 AAR 并放进 app/libs/。
      # 不把 AAR 提交进仓库：它是二进制产物，且必须与锁定的核心版本一致
      # （每次都由 libbox-aar 作业按 versions.lock.json 重新构建）。
      - name: Fetch the core binding (libbox.aar)
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: ${{ inputs.version_dir }}/src/apps/android/app/libs

      - name: Confirm the core binding landed where Gradle looks for it
        working-directory: ${{ inputs.version_dir }}/src/apps/android
        run: |
          set -euo pipefail
          # Gradle 的 flatDir 仓库只认 app/libs 下的 *.aar。
          # 路径写错时构建仍然"成功"，只是 APK 里没有核心——
          # 那种失败要到用户装上之后才会发现。
          ls -la app/libs/
          test -s app/libs/libbox.aar \
            || { echo "::error::app/libs/libbox.aar is missing or empty"; exit 1; }

      - name: Build the APK for the requested ABI
        working-directory: ${{ inputs.version_dir }}/src/apps/android
        env:
          ABI: ${{ matrix.abi }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          # 清单里的 abi 字段已经是 Android 的取值（arm64-v8a / armeabi-v7a / x86），
          # 因此直接用，不做二次映射——二次映射是错位的常见来源。
          if [ "${BUILD_TYPE:-test}" = "release" ]; then
            variant="Release"
          else
            variant="Debug"
          fi
          echo "building variant=${variant} abi=${ABI}"
          gradle --no-daemon ":app:assemble${variant}" "-Ppcx.abiFilter=${ABI}"

      - name: Verify the APK actually contains the requested ABI
        working-directory: ${{ inputs.version_dir }}/src/apps/android
        env:
          ABI: ${{ matrix.abi }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE:-test}" = "release" ]; then
            pattern="app/build/outputs/apk/release"
          else
            pattern="app/build/outputs/apk/debug"
          fi
          apk=$(find "$pattern" -name '*.apk' 2>/dev/null | head -n1 || true)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          echo "apk: $apk"

          # 列出原生库目录，确认只包含请求的 ABI。
          #
          # 只检查「构建成功」是不够的：ABI 过滤配错时构建照样成功，
          # 产出的却是另一个架构的包，而用户要到安装或运行时才发现。
          abs=$(unzip -l "$apk" | awk '/lib\// { split($4, p, "/"); print p[2] }' | sort -u | tr -d '\r')
          echo "ABIs found in the APK:"
          echo "$abs" | sed 's/^/  /'

          if [ -z "$abs" ]; then
            # 这条曾经只是警告。现在核心绑定已经接进来了，因此必须失败：
            # 一个不含原生库的 APK **装上去也不会代理任何流量**，
            # 而那正是本项目长期挂着的问题（VPN 能建立但不代理）。
            echo "::error::the APK contains no native libraries; the core binding did not make it into the package"
            exit 1
          elif ! echo "$abs" | grep -qx "$ABI"; then
            echo "::error::the APK does not contain the requested ABI '$ABI'"
            exit 1
          elif [ "$(echo "$abs" | wc -l)" -ne 1 ]; then
            echo "::error::the APK contains more than one ABI; the filter did not apply"
            exit 1
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.id }}
          path: ${{ inputs.version_dir }}/src/apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record the limitations of this build
        run: |
          echo "::notice::built APK for ${{ matrix.id }} (abi=${{ matrix.abi }})"
          echo "This APK embeds the pinned sing-box core (libbox) and captures traffic via VpnService."
          echo "Runtime verification on a real device is not performed by this workflow; it stays 'not_run'."

  summary:
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          set -euo pipefail
          echo "resolved targets: ${{ needs.resolve.outputs.count }}"
          echo "build job result: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Android build failed for at least one required target"
            exit 1
          fi
