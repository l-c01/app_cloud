# Gradle 配置 / Gradle properties.
#
# 刻意保持最小：这里的选项都会影响所有开发者与 CI 的构建行为，
# 加进来一项就要说清为什么。

# 并行构建与缓存：CI 与本机都受益，且不改变产物。
org.gradle.parallel=true
org.gradle.caching=true

# JVM 堆：Compose + AGP 的默认堆在中等规模工程上偏小，
# 表现为随机的 OOM 或构建中途被杀。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX：新工程必须开启，否则 AndroidX 依赖无法解析。
android.useAndroidX=true

# Kotlin 官方代码风格。开启后 ktlint/detekt 的规则才有意义。
kotlin.code.style=official

# 不把 R 类传递到依赖模块：减小方法数，加快构建。
android.nonTransitiveRClass=true
